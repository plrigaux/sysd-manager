[workspace]
members = [
  "transtools",
  "sysd-manager-translating",
  "tiny_daemon",
  "sysd-manager-proxy",
  "sysd-manager-comcontroler",
  "sysd-manager-test-base",
  "sysd-manager-base",
  "tool",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Pierre-Luc Rigaux <plrigaux@users.noreply.github.com>"]
license = "GPL-3+"
repository = "https://github.com/plrigaux/sysd-manager"

[package]
name = "sysd-manager"
version = "2.21.4"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = "README.md"
authors = { workspace = true }
description = "Application to empower user to manage their <b>systemd units</b> via Graphical User Interface. Not only are you able to make changes to the enablement and running status of each of the units, but you will also be able to view and modify their unit files and check the journal logs."
keywords = ["gtk4", "linux", "systemd"]
rust-version = { workspace = true }

default-run = "sysd-manager"

[[bin]]
name = "sysd-manager"
path = "src/main.rs"

[features]
default = ["systemd/default", "base/default"]
flatpak = ["systemd/flatpak", "base/flatpak"]
appimage = ["systemd/appimage", "base/appimage"]

[profile.release]
lto = true

[workspace.dependencies]
base = { version = "2.19", path = "./sysd-manager-base", package = "sysd-manager-base" }
systemd = { version = "2.19", path = "./sysd-manager-comcontroler", package = "sysd-manager-comcontroler" }
clap = { version = "4.5", features = ["derive"] }
constcat = "0.6"
chrono = "0.4"
dotenv = "0.15"
enumflags2 = "0.7"
flagset = "0.4"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gio = { version = "0", package = "gio", features = ["v2_84"] }
glib = { version = "0", package = "glib", features = ["v2_84"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
regex = "1.12"
serde = "1.0"
strum = { version = "0.28", features = ["derive"] }
test-base = { version = "0.1", path = "./sysd-manager-test-base", package = "sysd-manager-test-base" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "fmt",
  "chrono",
  "env-filter",
] }
tracing-journald = "0.3"
zvariant = "5"
zbus = { version = "5.11", default-features = false, features = [
  "tokio",
  "blocking-api",
] }

[dependencies]
pango = { version = "0", package = "pango", features = ["v1_56"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
gio.workspace = true
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
glib.workspace = true
flagset.workspace = true
base.workspace = true
chrono.workspace = true
clap.workspace = true
constcat.workspace = true
const_format = "0.2.34"
dotenv.workspace = true
enumflags2.workspace = true
formatx = "0.4"
foreign-types-shared = "0.3.1"
freedesktop_entry_parser = "2"
futures-util = "0.3"
gettext-rs.workspace = true
indexmap.workspace = true
itertools = "0.15"
libc.workspace = true
paste = "1"
regex.workspace = true
serde.workspace = true
sourceview5 = "0.11"
strum.workspace = true
systemd.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing-journald.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
uzers = "0.12"
toml = "1"
zvariant.workspace = true

[dev-dependencies]
test-base.workspace = true


[build-dependencies]
#glib-build-tools = "0.19.0"
#cargo-generate-rpm = "0.14.1"
quick-xml = "0.42"
translating = { version = "0.4.2", path = "./sysd-manager-translating", package = "sysd-manager-translating" }

[package.metadata.deb]
section = "utils"
maintainer = "Pierre-Luc Rigaux <plrigaux@users.noreply.github.com>"
depends = "libgtk-4-1 (>=4.21), libadwaita-1-0 (>=1.8), libsystemd0 (>=257), libgtksourceview-5-0 (>=5.16), libgtextutils0v5"
systemd-units = { unit-name = "sysd-manager-proxy", unit-scripts = "generated", enable = false }
changelog = "generated/changelog"
assets = [

  [
    "target/release/sysd-manager",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/sysd-manager-proxy",
    "usr/bin/",
    "755",
  ],
  [
    "data/icons/hicolor/scalable/apps/io.github.plrigaux.sysd-manager.svg",
    "usr/share/icons/hicolor/scalable/apps/",
    "644",
  ],
  [
    "data/schemas/io.github.plrigaux.sysd-manager.gschema.xml",
    "usr/share/glib-2.0/schemas/",
    "644",
  ],
  [
    "generated/io.github.plrigaux.sysd-manager.desktop",
    "usr/share/applications/",
    "644",
  ],
  [
    "generated/io.github.plrigaux.sysd-manager.metainfo.xml",
    "usr/share/metainfo/",
    "644",
  ],
  [
    "generated/io.github.plrigaux.SysDManager.policy",
    "usr/share/polkit-1/actions/",
    "644",
  ],
  [
    "sysd-manager-proxy/data/50-io.github.plrigaux.SysDManager.rules",
    "usr/share/polkit-1/rules.d/",
    "644",
  ],

]
