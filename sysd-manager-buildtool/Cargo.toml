[package]
name = "sysd-manager-buildtool"
version = "2.23.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Building tools for sysd-manager."
keywords = ["dbus", "sysd-manager", "changelogs"]

[lib]
name = "tool_lib"
path = "src/lib.rs"

[[bin]]
name = "tool"
path = "src/main.rs"

[features]
default = []

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
quick-xml = "0.42"
